# Production setup on the server (deploy.sh). Secrets live in root-only files in /etc/application-tracker:
#   db.env      POSTGRES_PASSWORD=...           (created by deploy.sh)
#   app.env     PGPASSWORD=... (same password)  (created by deploy.sh)
#   google.env  GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET (added by hand, see README)
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tracker
      POSTGRES_USER: tracker
    env_file: /etc/application-tracker/db.env
    command: postgres -c shared_buffers=64MB -c max_connections=20
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracker -d tracker"]
      interval: 5s
      retries: 10
    mem_limit: 256m
    restart: unless-stopped
    logging:
      options: { max-size: "10m", max-file: "3" }
    # No ports: only the app container can reach the database.

  app:
    image: application-tracker:latest
    build: .
    environment:
      APP_ORIGIN: https://applicationtracker.tech
      PGHOST: db
      PGUSER: tracker
      PGDATABASE: tracker
    env_file:
      - /etc/application-tracker/app.env
      - path: /etc/application-tracker/google.env
        required: false
    ports:
      - "127.0.0.1:8082:3000"
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    restart: unless-stopped
    logging:
      options: { max-size: "10m", max-file: "3" }

volumes:
  db-data:
  uploads:
